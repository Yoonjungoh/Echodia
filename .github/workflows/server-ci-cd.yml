name: Server CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
  pull_request:
    paths:
      - 'Server/**'

jobs:
  # CI: GitHub 클라우드에서 빌드 + 테스트
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore
        run: |
          dotnet restore Server/Server/Server.csproj
          dotnet restore Server/ServerTests/ServerTests.csproj

      - name: Build
        run: |
          dotnet build Server/Server/Server.csproj --no-restore --configuration Release
          dotnet build Server/ServerTests/ServerTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Server/ServerTests/ServerTests.csproj --no-build --configuration Release --verbosity normal

  # CD: 내 PC(Self-hosted Runner)에서 서버 재배포
  # main 브랜치 push + CI 통과 시에만 실행
  cd:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # 1. 서버 먼저 종료 → Windows 파일 락 해제
      - name: Stop Server
        run: |
          sc.exe stop EchodiaServer
          Start-Sleep -Seconds 2
          taskkill /F /IM Server.exe /T 2>$null
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            if (-not (Get-Process -Name "Server" -ErrorAction SilentlyContinue)) {
              Write-Host "Server process terminated."
              break
            }
            Write-Host "Waiting for Server to exit..."
            Start-Sleep -Seconds 1
          }
          if (Get-Process -Name "Server" -ErrorAction SilentlyContinue) {
            throw "Server process is still running after 30s — aborting."
          }
        shell: powershell
        continue-on-error: true

      # 2. 파일 락 풀린 상태에서 publish
      - name: Publish
        run: |
          dotnet publish Server/Server/Server.csproj -c Release -o C:\echodia\server
          Copy-Item -Path "Common" -Destination "C:\" -Recurse -Force
        shell: powershell

      # 3. 서비스 재시작
      - name: Start Server
        run: |
          sc.exe start EchodiaServer
          Start-Sleep -Seconds 3
          $status = (sc.exe query EchodiaServer) -join " "
          Write-Host $status
          if ($status -notmatch "RUNNING") { throw "Service failed to start" }
        shell: powershell
